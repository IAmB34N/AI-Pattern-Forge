# Remove `final` from Slot.x / Slot.y so the screen can reposition the player-inventory slots
# when the user cycles the terminal style (Small/Medium/Tall/Full). Slot index/order is unchanged
# so this is purely a client-side visual relocation; server-side container state is untouched.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
